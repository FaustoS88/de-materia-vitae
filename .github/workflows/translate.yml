name: Auto-translate protocols

on:
  push:
    branches: [develop]
    paths:
      - 'protocols/*.md'

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pick the translations this push did not update
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # After a force push the old head may be gone: compare with the parent instead
          changed=$(git diff --name-only --diff-filter=d "$BEFORE" "$GITHUB_SHA" 2>/dev/null || git diff --name-only --diff-filter=d HEAD^ HEAD)
          todo=""
          for name in $(echo "$changed" | sed -n 's|^protocols/\([^/]*\.md\)$|\1|p'); do
            [ "$name" = _template.md ] && continue
            for lang in it es; do
              echo "$changed" | grep -qx "translations/$lang/$name" || todo="$todo $lang/$name"
            done
          done
          todo=${todo# }
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "To translate: ${todo:-nothing}"

      - name: Translate to IT and ES
        if: steps.pick.outputs.todo != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TODO: ${{ steps.pick.outputs.todo }}
        run: |
          cat > /tmp/translate.mjs << 'SCRIPT'
          import { readFileSync, writeFileSync, mkdirSync } from 'node:fs'
          import { join } from 'node:path'

          const ROOT = process.env.GITHUB_WORKSPACE
          const LANGS = { it: 'Italian', es: 'Spanish' }
          const MODEL = 'openai/gpt-oss-120b'
          const API = 'https://api.groq.com/openai/v1/chat/completions'

          async function translate(markdown, langName) {
            const res = await fetch(API, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GROQ_API_KEY}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: MODEL,
                messages: [
                  { role: 'system', content: `You are a precise medical/scientific translator. Translate the following markdown from English to ${langName}. Preserve ALL markdown formatting, URLs, DOIs, PMIDs, page numbers and star ratings. Copy every citation label exactly as written, untranslated: author names, years, journal names in *italics* (*Sleep* stays *Sleep*) and titles in quotes. Translate naturally using proper ${langName} medical terminology. Return ONLY the translated markdown.` },
                  { role: 'user', content: markdown },
                ],
                temperature: 0.2,
                max_tokens: 32000,
              }),
            })
            if (!res.ok) throw new Error(`Groq ${res.status}: ${await res.text()}`)
            const data = await res.json()
            const text = data.choices[0]?.message?.content || ''
            if (data.choices[0]?.finish_reason === 'length') throw new Error('Groq cut the translation at max_tokens')
            if (!text.trim()) throw new Error('Groq returned an empty translation')
            return text
          }

          for (const item of process.env.TODO.split(' ')) {
            const [lang, file] = item.split('/')
            const english = readFileSync(join(ROOT, 'protocols', file), 'utf-8')
            process.stdout.write(`  [${lang.toUpperCase()}] ${file}... `)
            const t0 = Date.now()
            const translated = await translate(english, LANGS[lang])
            mkdirSync(join(ROOT, 'translations', lang), { recursive: true })
            writeFileSync(join(ROOT, 'translations', lang, file), translated, 'utf-8')
            console.log(`done (${((Date.now()-t0)/1000).toFixed(1)}s)`)
          }
          SCRIPT
          node /tmp/translate.mjs

      - name: Open a pull request to develop with the citation check
        if: steps.pick.outputs.todo != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TODO: ${{ steps.pick.outputs.todo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          short=${GITHUB_SHA::7}
          branch="i18n/translate-$short"
          git switch -c "$branch"
          git add translations/
          if git diff --cached --quiet; then
            echo "No translation changes"
            exit 0
          fi
          git commit -m "chore(i18n): translate $short to IT and ES"
          code=0
          python3 tools/check-citations.py > /tmp/check.txt || code=$?
          cat /tmp/check.txt
          summary=$(tail -1 /tmp/check.txt)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push --force origin "$branch"
          # On the bot's PR check-citations.yml starts but runs no jobs, so the result goes on the commit as a status
          state=$([ "$code" -eq 0 ] && echo success || echo failure)
          gh api --silent "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context=check-citations -f description="${summary:0:140}" -f target_url="$run"
          gh pr view "$branch" > /dev/null 2>&1 || gh pr create --base develop --head "$branch" \
            --title "Translate $short to IT and ES" \
            --body "$(printf 'Machine translation (Groq `openai/gpt-oss-120b`) of the protocols changed in %s: %s.\n\nCitation check: %s\n\nRun: %s' "$GITHUB_SHA" "$TODO" "$summary" "$run")"
          exit $code
